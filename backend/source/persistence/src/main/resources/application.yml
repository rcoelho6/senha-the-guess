server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: persistence
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/senha_game}
    username: ${DATABASE_USERNAME:senha_game}
    password: ${DATABASE_PASSWORD:senha_game_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC